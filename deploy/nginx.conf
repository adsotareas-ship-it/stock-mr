# /etc/nginx/sites-available/stock-mr
# Requiere también deploy/nginx-limits.conf en /etc/nginx/conf.d/.
# Temporal por IP:  listen 8080; server_name _;
# Con dominio:      listen 80; server_name TU_DOMINIO;  (luego `certbot --nginx -d TU_DOMINIO`)
server {
    listen 8080;
    server_name _;

    client_max_body_size 2m;

    location = /api/login {
        limit_req zone=stock_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
