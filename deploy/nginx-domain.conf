# /etc/nginx/sites-available/stock-mr-domain
# Certbot añade el bloque 443 y la redirección:  certbot --nginx -d stocksmatechnology.ddns.net
server {
    listen 80;
    server_name stocksmatechnology.ddns.net;

    client_max_body_size 2m;

    location = /api/login {
        limit_req zone=stock_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
